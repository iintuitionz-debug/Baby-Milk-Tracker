<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baby Milk Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milk Log">
<style>
:root{--bg:#eaf5fd;--card:#fff;--ink:#23323f;--mute:#6f8798;--acc:#4aa3df;--acc2:#d4ebfa;--line:#d6e8f4;--bar:#a9d4f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c25;--card:#1b2a36;--ink:#eaf4fb;--mute:#8fa7b8;--acc:#6bb8ee;--acc2:#27465c;--line:#2b4050;--bar:#3f6f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121c25;--card:#1b2a36;--ink:#eaf4fb;--mute:#8fa7b8;--acc:#6bb8ee;--acc2:#27465c;--line:#2b4050;--bar:#3f6f8f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.ring .c small{font-weight:400;color:var(--mute);font-size:12px}
.stats div{margin-bottom:6px;color:var(--mute);font-size:14px}.stats b{color:var(--ink);font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit;color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.add{width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:17px;cursor:pointer}
.add:active{transform:scale(.98)}
.feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed:last-child{border:0}.feed .t{color:var(--mute);width:64px;font-size:14px}.feed .a{flex:1;font-weight:600}
.feed .k{font-size:12px;color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.week{display:flex;align-items:flex-end;gap:8px;height:110px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.week i{display:block;width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px}
.week .today i{background:var(--acc)}
.muted{color:var(--mute);font-size:14px}
h2{font-size:16px;margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>🍼 Milk Log</h1>

<div class="card ringwrap">
  <div class="ring">
    <svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="64" cy="64" r="54" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" style="transition:stroke-dashoffset .5s"/></svg>
    <div class="c"><span id="tot">0</span><small id="goalTxt"></small></div>
  </div>
  <div class="stats">
    <div>Feeds today<br><b id="cnt">0</b></div>
    <div>Last feed<br><b id="last">–</b></div>
  </div>
</div>

<div class="card">
  <h2>Log a feed</h2>
  <div class="chips" id="chips"></div>
  <div class="row"><input id="amt" type="number" inputmode="decimal" min="0" placeholder="Amount"><select id="kind"><option>Formula</option><option>Breast milk</option></select></div>
  <div class="row"><input id="when" type="datetime-local"></div>
  <button class="add" id="addBtn">Add feed</button>
</div>

<div class="card"><h2>Today</h2><div id="list"></div></div>

<div class="card"><h2>Last 7 days</h2><div class="week" id="week"></div></div>

<div class="card">
  <h2>Settings</h2>
  <div class="row"><select id="unit"><option value="ml">Millilitres (ml)</option><option value="oz">Ounces (oz)</option></select><input id="goal" type="number" inputmode="decimal" placeholder="Daily goal"></div>
  <div class="muted">Data is saved on this device only. On iPhone: Share → Add to Home Screen. Check your daily goal with your paediatrician.</div>
</div>
</main>

<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), OZ=29.5735;
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem('milk_v1'));if(r&&r.feeds)return r}catch(e){}return{feeds:[],unit:'ml',goal:700}}
function save(){try{localStorage.setItem('milk_v1',JSON.stringify(S))}catch(e){}}
const toU=ml=>S.unit==='ml'?Math.round(ml):Math.round(ml/OZ*10)/10;
const toMl=v=>S.unit==='ml'?v:v*OZ;
const fmt=ml=>toU(ml)+' '+S.unit;
const key=d=>{d=new Date(d);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const nowInput=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

function render(){
  const now=new Date(), tk=key(now);
  const today=S.feeds.filter(f=>key(f.t)===tk).sort((a,b)=>b.t-a.t);
  const total=today.reduce((s,f)=>s+f.ml,0);
  $('#tot').textContent=fmt(total);
  $('#goalTxt').textContent='of '+fmt(S.goal);
  $('#arc').style.strokeDashoffset=339.3*(1-Math.min(1,total/S.goal));
  $('#cnt').textContent=today.length;
  $('#last').textContent=today.length?hm(today[0].t):'–';
  $('#list').innerHTML=today.length?today.map(f=>`<div class="feed"><span class="t">${hm(f.t)}</span><span class="a">${fmt(f.ml)}<br><span class="k">${f.kind}</span></span><button class="del" data-id="${f.id}" aria-label="Delete">✕</button></div>`).join(''):'<div class="muted">No feeds logged yet today.</div>';
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=key(d);days.push({d,v:S.feeds.filter(f=>key(f.t)===k).reduce((s,f)=>s+f.ml,0),today:i===0})}
  const mx=Math.max(S.goal,...days.map(x=>x.v));
  $('#week').innerHTML=days.map(x=>`<div class="${x.today?'today':''}"><span>${x.v?toU(x.v):''}</span><i style="height:${Math.round(x.v/mx*80)}%"></i><span>${x.d.toLocaleDateString([], {weekday:'narrow'})}</span></div>`).join('');
  $('#unit').value=S.unit;$('#goal').value=toU(S.goal);
  const presets=S.unit==='ml'?[60,90,120,150,180]:[2,3,4,5,6];
  $('#chips').innerHTML=presets.map(p=>`<button class="chip${+$('#amt').value===p?' on':''}" data-v="${p}">${p} ${S.unit}</button>`).join('');
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){$('#amt').value=b.dataset.v;render()}};
$('#amt').oninput=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===+$('#amt').value))};
$('#addBtn').onclick=()=>{
  const v=parseFloat($('#amt').value);if(!(v>0)){$('#amt').focus();return}
  const t=new Date($('#when').value||Date.now()).getTime();
  S.feeds.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),t,ml:toMl(v),kind:$('#kind').value});
  save();$('#amt').value='';$('#when').value=nowInput();render();
};
$('#list').onclick=e=>{const b=e.target.closest('.del');if(b){S.feeds=S.feeds.filter(f=>f.id!==b.dataset.id);save();render()}};
$('#unit').onchange=e=>{S.unit=e.target.value;$('#amt').value='';save();render()};
$('#goal').onchange=e=>{const v=parseFloat(e.target.value);if(v>0){S.goal=toMl(v);save()}render()};
$('#when').value=nowInput();
render();
</script>
</body>
</html>
